<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>個人開発あるある分岐ゲーム</title>
<style>
:root{
  --bg:#0d1020; --panel:#171b31; --panel2:#1f2440; --line:#39406e;
  --text:#eef0ff; --muted:#9aa3c7; --accent:#ffd34d; --accent2:#57c7ff;
  --up:#5fd68a; --down:#ff7a7a; --warn:#ffb84d; --paid:#ffab5e; --free:#4dd8c3;
  --radius:14px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1200px 600px at 50% -10%, #232a52 0%, var(--bg) 55%) fixed, var(--bg);
  color:var(--text);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;
  min-height:100vh;
}
#app{max-width:1060px;margin:0 auto;padding:14px 14px 40px}
button{font-family:inherit;cursor:pointer}
h1,h2{margin:0}

/* ===== 共通パネル ===== */
.panel{
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:2px solid var(--line); border-radius:var(--radius);
  box-shadow:0 6px 24px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06);
}
.panel-tag{
  display:inline-block;background:var(--line);color:#dfe4ff;font-size:.72rem;font-weight:700;
  padding:2px 10px;border-radius:0 0 8px 0;letter-spacing:.08em;
}

/* ===== タイトル ===== */
.title-screen{text-align:center;padding:38px 16px 8px}
.title-logo{
  font-size:clamp(1.7rem,6vw,3rem);font-weight:900;line-height:1.25;letter-spacing:.02em;
  background:linear-gradient(180deg,#fff 20%,var(--accent) 55%,#ff9d5c);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 rgba(0,0,0,.45));
}
.title-sub{color:var(--muted);margin:14px auto 6px;max-width:560px;line-height:1.7;font-size:.95rem}
.title-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:26px}
.btn-game{
  border:2px solid var(--line);background:linear-gradient(180deg,#2b3160,#1d2242);color:var(--text);
  font-size:1.05rem;font-weight:800;padding:14px 30px;border-radius:12px;min-width:210px;
  box-shadow:0 4px 0 #0a0c1c, 0 8px 18px rgba(0,0,0,.4);transition:transform .08s, box-shadow .08s;
}
.btn-game:active{transform:translateY(3px);box-shadow:0 1px 0 #0a0c1c}
.btn-game.primary{border-color:#8a6d1f;background:linear-gradient(180deg,#ffdf7e,var(--accent));color:#3a2c00}
.btn-game:disabled{opacity:.45;cursor:default}
.title-note{color:var(--muted);font-size:.8rem;margin-top:18px}

/* ===== 相棒セレクト ===== */
.select-head{text-align:center;margin:18px 0 4px}
.select-head h2{font-size:1.35rem}
.select-head p{color:var(--muted);font-size:.9rem;line-height:1.7}
.partner-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:16px}
.partner-card{
  text-align:left;color:var(--text);padding:14px;border-radius:var(--radius);
  background:linear-gradient(180deg,var(--panel2),var(--panel));border:2px solid var(--line);
  transition:transform .12s, border-color .12s, box-shadow .12s;
}
.partner-card:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 10px 22px rgba(0,0,0,.5)}
.partner-avatar{display:flex;justify-content:center;padding:6px 0 2px}
.partner-name{text-align:center;font-weight:900;font-size:1.08rem;margin-top:4px}
.partner-desc{color:var(--muted);font-size:.82rem;line-height:1.6;min-height:4.6em;margin-top:6px}
.partner-stats{margin-top:8px;font-size:.8rem;display:grid;gap:5px}
.partner-stats .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.partner-stats .k{color:var(--muted)}
.statbar{flex:1;height:7px;background:#0b0e1e;border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.statbar>i{display:block;height:100%;background:var(--accent2)}

/* ===== ゲーム画面レイアウト ===== */
.game-layout{display:grid;grid-template-columns:1fr 300px;gap:14px;align-items:start}
@media(max-width:820px){.game-layout{grid-template-columns:1fr}}

/* カレンダー */
.calendar{display:flex;align-items:center;gap:0;margin:2px 0 12px;overflow-x:auto;padding:6px 2px}
.cal-node{display:flex;flex-direction:column;align-items:center;gap:3px;flex:0 0 auto;position:relative;z-index:1}
.cal-dot{
  width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:#12152a;
  display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:800;color:var(--muted);
}
.cal-node.done .cal-dot{background:#2c3565;color:#cfd6ff;border-color:#4a549a}
.cal-node.now .cal-dot{background:var(--accent);border-color:#ffe9a3;color:#3a2c00;box-shadow:0 0 0 4px rgba(255,211,77,.25);transform:scale(1.12)}
.cal-node.paid .cal-dot{border-color:var(--paid)}
.cal-node.free .cal-dot{border-color:var(--free)}
.cal-label{font-size:.62rem;color:var(--muted);white-space:nowrap}
.cal-line{flex:1 1 8px;height:3px;background:var(--line);border-radius:2px;margin-bottom:16px;min-width:8px}
.cal-line.done{background:#4a549a}

/* ステージ */
.stage{position:relative;overflow:hidden}
.stage-bg{position:absolute;inset:0;opacity:.5;pointer-events:none;transition:background 1s}
.stage-inner{position:relative;padding:16px}
.stage-top{display:flex;gap:14px;align-items:flex-end}
.stage-avatar{
  flex:0 0 auto;width:118px;height:118px;border-radius:16px;border:2px solid var(--line);
  background:rgba(10,12,26,.55);display:flex;align-items:center;justify-content:center;
}
@media(max-width:520px){.stage-avatar{width:88px;height:88px}}
.stage-meta{flex:1;min-width:0}
.month-banner{font-size:.8rem;color:var(--accent);font-weight:800;letter-spacing:.12em}
.scene-title{font-size:clamp(1.15rem,3.6vw,1.5rem);font-weight:900;line-height:1.4;margin-top:2px}
.partner-line{color:var(--muted);font-size:.85rem;margin-top:4px}
.msg-window{
  margin-top:14px;background:rgba(8,10,22,.78);border:2px solid var(--line);border-radius:12px;
  padding:16px;line-height:1.9;font-size:1rem;min-height:6.2em;white-space:pre-wrap;cursor:pointer;
}
.msg-note{
  margin-top:10px;background:rgba(87,199,255,.1);border-left:4px solid var(--accent2);
  padding:10px 12px;border-radius:0 8px 8px 0;line-height:1.7;font-size:.92rem;
}
.stage.event .msg-window{border-color:#8a5a1f}
.event-frame{position:absolute;inset:0;pointer-events:none;border-radius:var(--radius);
  border:3px solid transparent;background:
  repeating-linear-gradient(45deg,rgba(255,184,77,.0) 0 14px,rgba(255,184,77,.0) 14px 28px) border-box;}

/* コマンド */
.commands{margin-top:14px}
.commands-tag{font-size:.78rem;font-weight:800;color:var(--muted);letter-spacing:.14em;margin:0 2px 8px}
.command-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:640px){.command-grid{grid-template-columns:1fr}}
.command{
  text-align:left;color:var(--text);border:2px solid var(--line);border-radius:12px;padding:13px 14px;
  background:linear-gradient(180deg,#262c52,#1a1f3d);min-height:64px;
  box-shadow:0 3px 0 #0a0c1c;transition:transform .08s,border-color .12s, box-shadow .08s;
}
.command:hover:not(:disabled){border-color:var(--accent);transform:translateY(-2px)}
.command:active:not(:disabled){transform:translateY(2px);box-shadow:0 0 0 #0a0c1c}
.command:disabled{opacity:.5;cursor:not-allowed}
.command-label{font-weight:800;font-size:.98rem;line-height:1.5;display:block}
.command-fx{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.fx-chip{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:20px;background:#0d1024;border:1px solid var(--line)}
.fx-chip.up{color:var(--up);border-color:#2c5c40}
.fx-chip.down{color:var(--down);border-color:#6e3535}
.fx-chip.rand{color:var(--warn);border-color:#6e551f}
.command-blocked{display:block;margin-top:7px;font-size:.75rem;color:var(--down)}

/* ステータスパネル */
.status-panel{padding:0 0 12px;position:sticky;top:10px}
@media(max-width:820px){.status-panel{position:static}}
.status-body{padding:12px 14px 2px}
.status-partner{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.status-partner .nm{font-weight:900;font-size:1.02rem}
.status-partner .sub{color:var(--muted);font-size:.75rem}
.gauge{margin:10px 0}
.gauge-head{display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:4px}
.gauge-head .k{color:var(--muted);font-weight:700}
.gauge-head .v{font-weight:900}
.gauge-bar{height:13px;background:#0b0e1e;border:1px solid var(--line);border-radius:7px;overflow:hidden;position:relative}
.gauge-fill{height:100%;border-radius:6px;transition:width .6s cubic-bezier(.2,.8,.3,1)}
.gauge-fill.yaruki{background:linear-gradient(90deg,#57c7ff,#5fd68a)}
.gauge-fill.yaruki.mid{background:linear-gradient(90deg,#ffb84d,#ffd34d)}
.gauge-fill.yaruki.low{background:linear-gradient(90deg,#ff7a7a,#ffb84d)}
.gauge-fill.money{background:linear-gradient(90deg,#b48cff,#57c7ff)}
.stat-rows{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.stat-cell{background:#12152a;border:1px solid var(--line);border-radius:10px;padding:8px 10px;position:relative}
.stat-cell .k{font-size:.7rem;color:var(--muted);font-weight:700}
.stat-cell .v{font-size:1.05rem;font-weight:900;margin-top:1px}
.stat-cell .v.neg{color:var(--down)}
.pips{display:flex;gap:4px;margin-top:3px}
.pip{width:15px;height:15px;border-radius:50%;border:2px solid var(--line);background:#0b0e1e}
.pip.on{background:var(--accent2);border-color:#a8e2ff;box-shadow:0 0 6px rgba(87,199,255,.6)}
.infinity{color:var(--accent2);font-weight:900}
.flash-up{animation:fUp .6s}
.flash-down{animation:fDown .6s}
@keyframes fUp{0%{background:#1d4030}100%{background:#12152a}}
@keyframes fDown{0%{background:#4a2020}100%{background:#12152a}}
.delta-float{
  position:absolute;right:6px;top:2px;font-weight:900;font-size:.9rem;pointer-events:none;
  animation:floatUp .9s ease-out forwards;z-index:3;
}
.delta-float.up{color:var(--up)} .delta-float.down{color:var(--down)}
@keyframes floatUp{0%{opacity:0;transform:translateY(6px)}20%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
.side-btns{display:grid;gap:8px;padding:12px 14px 4px}
.btn-side{
  border:2px solid var(--line);background:#12152a;color:var(--text);border-radius:10px;
  padding:10px;font-weight:800;font-size:.9rem;
}
.btn-side.reset{border-color:#8a6d1f;color:var(--accent)}
.btn-side:disabled{opacity:.4;cursor:not-allowed}

/* 図鑑 */
.gallery{margin-top:14px;padding-bottom:12px}
.gallery-body{padding:10px 14px 2px}
.gallery-head{display:flex;justify-content:space-between;font-size:.85rem;font-weight:800}
.gallery-head span{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{font-size:.75rem;font-weight:700;padding:4px 10px;border-radius:20px;border:1px solid var(--line);color:var(--muted);background:#12152a}
.chip.got{color:#3a2c00;background:linear-gradient(180deg,#ffdf7e,var(--accent));border-color:#8a6d1f}

/* オーバーレイ（月替わり／イベント） */
.overlay{
  position:fixed;inset:0;background:rgba(5,6,14,.72);display:flex;align-items:center;justify-content:center;
  z-index:50;padding:18px;animation:fadeIn .25s;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.overlay-card{
  max-width:440px;width:100%;text-align:center;padding:26px 22px;border-radius:16px;
  background:linear-gradient(180deg,#262c52,#171b31);border:2px solid var(--accent);
  box-shadow:0 18px 50px rgba(0,0,0,.6);animation:popIn .3s cubic-bezier(.2,1.4,.4,1);
}
@keyframes popIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.overlay-card.warn{border-color:var(--warn)}
.overlay-big{font-size:1.7rem;font-weight:900}
.overlay-sub{color:var(--muted);margin-top:8px;line-height:1.7;font-size:.92rem}
.overlay-lines{margin:14px auto 4px;text-align:left;display:inline-block;line-height:1.9;font-size:.95rem}
.overlay-lines .up{color:var(--up);font-weight:800}
.overlay-lines .down{color:var(--down);font-weight:800}
.overlay-btn{margin-top:16px}

/* エンディング */
.ending-screen{text-align:center;padding:30px 18px 10px}
.ending-badge{font-size:.8rem;font-weight:800;letter-spacing:.2em;color:var(--accent)}
.ending-name{font-size:clamp(1.5rem,5vw,2.3rem);font-weight:900;margin-top:8px;line-height:1.35}
.ending-text{
  max-width:600px;margin:18px auto 0;line-height:2;text-align:left;white-space:pre-wrap;
  background:rgba(8,10,22,.6);border:1px solid var(--line);border-radius:12px;padding:16px 18px;
}
.ending-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:9px;max-width:640px;margin:18px auto 0}
.ending-stat{background:#12152a;border:1px solid var(--line);border-radius:10px;padding:10px}
.ending-stat .k{font-size:.72rem;color:var(--muted);font-weight:700}
.ending-stat .v{font-size:1.15rem;font-weight:900;margin-top:2px}
.scene-enter{animation:sceneIn .45s cubic-bezier(.2,.9,.3,1)}
@keyframes sceneIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
.foot-note{color:var(--muted);font-size:.75rem;text-align:center;margin-top:22px}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
// ==LOGIC START==

/** @type {Record<string, Partner>} */
const PARTNERS = {
  chotto: { id:'chotto', name:'ちょっとGPT', monthly:3000, wakuMax:5, resetInit:0,
    desc:'万能のバランス型。何でもそつなくこなすが、どこか「ちょっと」惜しい。月額3,000円・枠は月ごとに回復。' },
  claim: { id:'claim', name:'クレームコード', monthly:3400, wakuMax:3, resetInit:1,
    desc:'レビュー性能は最高クラス。ただし枠は小さく、5時間で枯れる。リセット権1個持ち。月額3,400円。' },
  jomini: { id:'jomini', name:'ジョミニ', monthly:2000, wakuMax:5, resetInit:0,
    desc:'実装が速くてUIが揃う。隠し特性「モックでごまかす」。月額2,000円・枠は月ごとに回復。' },
  drop: { id:'drop', name:'ドロップシーク', monthly:0, wakuMax:0, resetInit:0,
    desc:'従量課金で激安。枠の概念がない代わりに、使うたびにお金が減る。たまに接続がドロップする。' },
  router: { id:'router', name:'クローズルーター', monthly:0, wakuMax:5, resetInit:0,
    desc:'いろんなモデルに繋げる無料枠。お金も枠の消費も軽い。ただし無料モデルは予告なく消える。' }
};

/** @type {Record<string, Scene>} */
const SCENES = {
  m1a: { month:1, title:'はじまり', text:`ある夜、動画で「AIに頼んだらアプリができた」という投稿を見た。コードは書けない。でも、なんだか自分にも作れそうな気がした。まずは相棒のAIに、思いついたアイデアをそのまま投げてみる。`,
    choices:[
      { label:'とにかくAIに全部作らせる', fx:{waku:-2,yaruki:5}, note:'3時間後、画面に何か表示された。エラーも出ているが、まず動いた。', next:'m1b' },
      { label:'先に「何を作るか」を紙に書き出してから頼む', fx:{waku:-1,yaruki:2}, note:'仕様を書くのに1時間。でもAIへの指示は一発で通った。', next:'m1b' }
    ]},
  m1b: { month:1, title:'何を作るか', text:`最初の1本、何を作るかで今後がだいたい決まる。`,
    choices:[
      { label:'自分の困りごとを解く道具を作る', fx:{yaruki:3}, set:{first:'self'}, note:'使うのは自分だけ。でも切実さは本物だ。', next:'m2a' },
      { label:'誰もが使う単機能ツールを作る', fx:{yaruki:2}, set:{first:'public'}, note:'利用者は多いはず。たぶん。きっと。', next:'m2a' },
      { label:'宝くじの予想システムを作る', fx:{yaruki:4}, set:{first:'lotto'}, note:'当たるかどうかは別として、作っている間が一番楽しい。', next:'m2a' }
    ]},
  m2a: { month:2, title:'動いた', text:`画面の中で、自分の考えたものが動いている。この瞬間のために、人は個人開発を始めるのだと思う。`,
    choices:[
      { label:'スクリーンショットを撮って眺める', fx:{yaruki:6}, note:'誰にも見せていないのに、もう満足度が高い。', next:'m2b' },
      { label:'すぐ次の機能を足したくなる', fx:{waku:-2,yaruki:-2}, note:'機能は増えた。完成は遠のいた。', next:'m2b' }
    ]},
  m2b: { month:2, title:'公開するか', text:`一応、動くものができた。人に見せられる形にするには、あと少しの手間がいる。`,
    choices:[
      { label:'公開する', fx:{tools:1,yaruki:4}, set:{published:true}, note:'公開ボタンを押した。今日からこれは「作品」だ。', next:'m3a' },
      { label:'まだ恥ずかしいので自分用にしておく', fx:{yaruki:-2}, note:'フォルダの中で静かに眠り始めた。', next:'m3a' }
    ]},
  m3a: { month:3, title:'PVの現実', text:`公開から1週間。アクセス数は3。内訳は、自分と、自分と、たぶん自分だ。`,
    choices:[
      { label:'そんなものだと割り切る', fx:{yaruki:2}, note:'利用者0でも、作った事実は残る。', next:'m3b' },
      { label:'告知のやり方を調べまくる', fx:{yaruki:-3,followers:3}, note:'調べるだけで週末が終わった。フォロワーは少し増えた。', next:'m3b' }
    ]},
  m3b: { month:3, title:'レビューという工程', text:`界隈の投稿で知った。「作ったAIとは別のAIに、コードを疑わせる」という工程があるらしい。自分の目では、自分の作ったものの粗は見えない。`,
    choices:[
      { label:'別のAIに一次レビューを頼む', fx:{waku:-2,yaruki:2}, set:{review:true}, note:'指摘が36件返ってきた。思ったより多い。でも全部、直す価値のあるものだった。', next:'m4a' },
      { label:'動いているから大丈夫だと判断する', fx:{yaruki:-2}, set:{review:false}, note:'速い。とにかく速い。でも不安で、夜にふと目が覚める。', next:'m4a' }
    ]},
  m4a: { month:4, title:'課金の階段', text:`無料枠の壁に当たることが増えてきた。有料プランは月2,000円。出すか、出さないか。`,
    choices:[
      { label:'有料プランに入る（毎月の固定費が増える）', fx:{money:-2000,yaruki:5}, set:{paid_plan:true}, note:'壁に当たるストレスが消えた。財布の紐だけが締まった。', next:'m4b' },
      { label:'無料の範囲でやりくりする', fx:{yaruki:-3}, note:'枠の残量を気にしながら進める日々が続く。', next:'m4b' }
    ]},
  m4b: { month:4, title:'深層レビュー', text:`一次レビューより深く、仕様と実装の食い違いまで疑う工程がある。時間はかかる。でも「問題なし」の報告ほど信用できないものはない、とも聞いた。`,
    choices:[
      { label:'深層レビューまで回す', fx:{waku:-3,yaruki:-2}, set:{deep:true}, note:'重大な指摘が1件出た。公開前でよかった、と心底思った。時間は溶けた。', next:'m5a' },
      { label:'今回は省略して次を急ぐ', fx:{yaruki:1}, set:{deep:false}, note:'1本多く作れる。代わりに、見落としの借金が少し残る。', next:'m5a' }
    ]},
  m5a: { month:5, title:'記録を書く', text:`開発の記録を記事にして公開する界隈がある。書けば誰かの役に立つかもしれないし、自分の宣伝にもなる。`,
    choices:[

/** @typedef {{money:number,yaruki:number,tools:number,followers:number,waku:number,support:number,reset:number,partnerId:string,wakuMax:number,month:number,flags:Record<string,any>,usedEvents:string[],publishedThisMonth:number,immediateEnding:string|null,sceneId:string,note:string,pendingEvent:string|null,route:string}} State */

/**
 * @param {string} partnerId
 * @returns {State}
 */
function newState(partnerId){
  const p=PARTNERS[partnerId];
  return {
    money:45000, yaruki:50, tools:0, followers:0, waku:p.wakuMax, support:0, reset:p.resetInit,
    partnerId, wakuMax:p.wakuMax, month:1,
    flags:{}, usedEvents:[], publishedThisMonth:0,
    immediateEnding:null, sceneId:'m1a', note:'', pendingEvent:null, route:''
  };
}

/**
 * @param {State} state
 * @param {Record<string,number>} fx
 * @returns {Record<string,number>} deltas applied
 */
function applyFx(state,fx){
  const deltas={};
  const p=PARTNERS[state.partnerId];
  const isDrop=state.partnerId==='drop';

  for(const [k,v] of Object.entries(fx)){
    if(v===0) continue;
    let cur=0, next=0;
    switch(k){
      case 'money':
        cur=state.money; next=cur+v;
        state.money=next; deltas.money=v; break;
      case 'yaruki':
        cur=state.yaruki; next=Math.max(0,Math.min(100,Math.round(cur+v)));
        state.yaruki=next; deltas.yaruki=next-cur; break;
      case 'tools':
        cur=state.tools; next=Math.max(0,cur+v);
        state.tools=next; deltas.tools=next-cur;
        if(v>0) state.publishedThisMonth+=v;
        break;
      case 'followers':
        cur=state.followers; next=Math.max(0,cur+v);
        state.followers=next; deltas.followers=next-cur; break;
      case 'waku':
        if(isDrop){
          const moneyDelta=v*500;
          cur=state.money; next=cur+moneyDelta;
          state.money=next; deltas.money=moneyDelta;
        }else{
          cur=state.waku; next=Math.max(0,Math.min(p.wakuMax,cur+v));
          state.waku=next; deltas.waku=next-cur;
        }
        break;
      case 'reset':
        cur=state.reset; next=Math.max(0,cur+v);
        state.reset=next; deltas.reset=next-cur; break;
      case 'support':
        cur=state.support; next=Math.max(0,cur+v);
        state.support=next; deltas.support=next-cur; break;
    }
  }
  return deltas;
}

/**
 * @param {State} state
 * @param {Choice} choice
 * @returns {boolean}
 */
function choiceBlocked(state,choice){
  const p=PARTNERS[state.partnerId];
  if(state.partnerId==='drop') return false;
  if(!choice.fx) return false;
  const wakuCost=-(choice.fx.waku||0);
  if(wakuCost<=0) return false;
  return state.waku < wakuCost;
}

/**
 * @param {State} state
 * @param {Choice} choice
 * @param {()=>number} rng
 * @returns {{nextScene:string|null,endingId:string|null,note:string,partnerChanged:boolean}}
 */
function resolveChoice(state,choice,rng){
  let note=choice.note||'';
  let partnerChanged=false;

  // apply fx
  const deltas=applyFx(state,choice.fx||{});

  // handle random outcomes
  if(choice.rand){
    let acc=0;
    const r=rng();
    for(const opt of choice.rand){
      acc+=opt.p;
      if(r<acc){
        applyFx(state,opt.fx||{});
        note=opt.note;
        break;
      }
    }
  }

  // handle flags
  if(choice.set){
    Object.assign(state.flags,choice.set);
    if(choice.set.route) state.route=choice.set.route;
  }

  // handle partner change
  if(choice.setPartner){
    const newP=PARTNERS[choice.setPartner];
    state.partnerId=choice.setPartner;
    state.wakuMax=newP.wakuMax;
    state.waku=newP.wakuMax;
    state.reset=newP.resetInit;
    partnerChanged=true;
  }

  // immediate ending from choice
  if(choice.end){
    state.immediateEnding=choice.end;
    return {nextScene:null,endingId:choice.end,note,partnerChanged};
  }

  // next scene
  const next=choice.next;
  if(next==='END'){
    return {nextScene:null,endingId:null,note,partnerChanged};
  }
  if(next==='return'){
    return {nextScene:state.sceneId,endingId:null,note,partnerChanged};
  }
  return {nextScene:next,endingId:null,note,partnerChanged};
}

/**
 * @param {State} state
 * @param {Scene} scene
 * @returns {Choice[]}
 */
function takeChoices(state,scene){
  const choices=scene.choices.filter(c=>!choiceBlocked(state,c));
  if(choices.length>0) return choices;
  // all blocked
  if(state.reset>0 && state.partnerId!=='drop' && state.waku<state.wakuMax){
    // auto use reset
    state.reset--;
    state.waku=state.wakuMax;
    // re-evaluate
    const retry=scene.choices.filter(c=>!choiceBlocked(state,c));
    if(retry.length>0) return retry;
  }
  // still all blocked -> allow all
  return scene.choices;
}

/**
 * @param {State} state
 * @returns {string|null}
 */
function checkImmediate(state){
  if(state.yaruki<=0) return 'burnout';
  if(state.money<0) return 'broke';
  return state.immediateEnding;
}

/**
 * @param {State} state
 * @param {()=>number} rng
 * @param {Set<string>} usedEvents
 * @returns {string|null} event id or null
 */
function monthEnd(state,rng,usedEvents){
  const p=PARTNERS[state.partnerId];

  // 1. monthly fee
  let fee=p.monthly;
  if(state.flags.paid_plan) fee+=500;
  if(fee>0) applyFx(state,{money:-fee});

  // 2. waku recovery (except drop)
  if(state.partnerId!=='drop'){
    state.waku=state.wakuMax;
  }

  // 3. money < 5000 -> yaruki -3
  if(state.money<5000) applyFx(state,{yaruki:-3});

  // 4. paid route -> yaruki -4
  if(state.route==='paid') applyFx(state,{yaruki:-4});

  // 5. random event draw
  let eventId=null;

  // jomini mock
  if(state.partnerId==='jomini' && state.publishedThisMonth>0 && !usedEvents.has('ev_mock') && rng()<0.35){
    eventId='ev_mock';
  }
  // drop connection
  else if(state.partnerId==='drop' && !usedEvents.has('ev_drop') && rng()<0.18){
    eventId='ev_drop';
  }
  // router gone
  else if(state.partnerId==='router' && !usedEvents.has('ev_gone') && rng()<0.14){
    eventId='ev_gone';
  }
  // company bare
  else if(!usedEvents.has('ev_bare') && rng()<0.012){
    eventId='ev_bare';
  }
  // general events (42%)
  else if(rng()<0.42){
    const general=['ev_reset','ev_stealth','ev_price','ev_folder','ev_invite','ev_outage'];
    const available=general.filter(e=>!usedEvents.has(e));
    if(available.length>0){
      eventId=available[Math.floor(rng()*available.length)];
    }
  }

  if(eventId){
    usedEvents.add(eventId);
    state.pendingEvent=eventId;
  }

  // 6. month++
  state.month++;
  state.publishedThisMonth=0;

  return eventId;
}

/**
 * @param {State} state
 * @returns {string}
 */
function finalEnding(state){
  if(state.route==='paid' && state.support>=4) return 'claim';
  if(state.followers>=40) return 'buzz';
  if(state.tools>=6) return 'mass';
  return 'continue';
}

function load(){
  const raw=localStorage.getItem(SAVE_KEY);
  if(raw){
    try{
      const s=JSON.parse(raw);
      s.publishedThisMonth=s.publishedThisMonth||0;
      s.immediateEnding=s.immediateEnding||null;
      s.pendingEvent=s.pendingEvent||null;
      s.route=s.route||'';
      s.support=s.support||0;
      s.usedEvents=s.usedEvents||[];
      if(!s.sceneId||!s.partnerId) return null;
      return s;
    }catch(e){}

  return null;
}

/* ===== 場面描画 ===== */
function fxChips(c){
  const isDrop=state.partnerId==='drop';
  const parts=[];
  if(c.fx){
    for(const [k,v] of Object.entries(c.fx)){
      if(v===0) continue;
      let label='',val='';
      switch(k){
        case 'money': label='お金'; val=(v>0?'+':'')+v.toLocaleString(); break;
        case 'yaruki': label='やる気'; val=(v>0?'+':'')+v; break;
        case 'tools': label='公開数'; val=(v>0?'+':'')+v; break;
        case 'followers': label='フォロワー'; val=(v>0?'+':'')+v; break;
        case 'waku':
          if(isDrop){ label='お金'; val=(v*500>0?'+':'')+(v*500).toLocaleString(); }
          else{ label='枠'; val=(v>0?'+':'')+v; }
          break;
        case 'reset': label='リセット権'; val=(v>0?'+':'')+v; break;
        case 'support': label='対応負荷'; val=(v>0?'+':'')+v; break;
      }
      if(label) parts.push(`<span class="fx-chip ${v>0?'up':'down'}">${label} ${val}</span>`);
    }
  }
  if(c.rand) parts.push('<span class="fx-chip rand">結果は運しだい</span>');
  return parts.join('');
}

function stopType(){ if(typeTimer){ clearInterval(typeTimer); typeTimer=null; } }
function startType(full){
  const el=$('#msgText');
  if(!el) return;
  stopType();
  if(full.length<=1){ el.textContent=full; return; }
  let i=0;
  el.textContent='';
  typeTimer=setInterval(()=>{
    i+=2;
    el.textContent=full.slice(0,i);
    if(i>=full.length) stopType();
  },12);
  el.parentElement.addEventListener('click',()=>{ stopType(); el.textContent=full; },{once:true});
}

      const before={money:state.money,yaruki:state.yaruki,tools:state.tools,followers:state.followers,waku:state.waku,reset:state.reset,support:state.support};
      state.reset--; state.waku=state.wakuMax;
      currentNote='リセット権を使った。枠が全回復した。';
      lastDeltas=diffParams(before,state);
      save(); renderScene();
    }
  });
  $('#restartBtn').addEventListener('click',()=>{
    if(confirm('最初からやり直しますか？セーブデータと進行が消えます。')){

      renderPartnerSelect();

  $('#toTitleBtn').addEventListener('click',()=>{ save(); renderTitle(); });

function diffParams(before,after){
  const d={};
  for(const k of ['money','yaruki','tools','followers','waku','reset','support']){
    const dv=(after[k]||0)-(before[k]||0);
    if(dv!==0) d[k]=dv;
  }
  return Object.keys(d).length?d:null;
}

/* ===== 進行（検証済み実装の流れをそのまま踏襲） ===== */
function handleChoice(choice){
  const before={money:state.money,yaruki:state.yaruki,tools:state.tools,followers:state.followers,waku:state.waku,reset:state.reset,support:state.support};
  const currentScene=SCENES[state.sceneId];
  const currentMonth=currentScene?currentScene.month:state.month;
  const result=resolveChoice(state,choice,rng);
  currentNote=result.note||'';

  let nextMonth=currentMonth;
  if(result.nextScene&&SCENES[result.nextScene]) nextMonth=SCENES[result.nextScene].month;
  const monthChanged=!!result.nextScene&&nextMonth>currentMonth;
  state.sceneId=result.nextScene||state.sceneId;

  const immediate=checkImmediate(state);
  if(immediate){ lastDeltas=diffParams(before,state); showEnding(immediate); return; }
  if(result.endingId){ lastDeltas=diffParams(before,state); showEnding(result.endingId); return; }

  if(state.pendingEvent){
    state.pendingEvent=null;
    const imm=checkImmediate(state);
    if(imm){ lastDeltas=diffParams(before,state); showEnding(imm); return; }
  }else{
    if(result.nextScene===null||result.nextScene==='END'){
      lastDeltas=diffParams(before,state);
      showEnding(finalEnding(state));
      return;
    }
    if(monthChanged){
      const mBefore={money:state.money,yaruki:state.yaruki};
      const usedEvents=new Set(state.usedEvents);
      const eventId=monthEnd(state,rng,usedEvents);
      state.usedEvents=[...usedEvents];
      const lines=[];
      const dm=state.money-mBefore.money, dy=state.yaruki-mBefore.yaruki;
      if(dm!==0) lines.push(`お金 <span class="${dm>0?'up':'down'}">${dm>0?'+':''}${dm.toLocaleString()}円</span>`);
      if(dy!==0) lines.push(`やる気 <span class="${dy>0?'up':'down'}">${dy>0?'+':''}${dy}</span>`);
      if(!lines.length) lines.push('変動なし');
      pendingMonthSplash={month:state.month,lines};
      if(eventId){ state.pendingEvent=eventId; pendingCutin=EVENTS[eventId].title; }
    }
  }
  lastDeltas=diffParams(before,state);
  save();
  renderScene();
}

/* ===== エンディング ===== */
function showEnding(endingId){
  const ending=ENDINGS[endingId];
  const finalStats=state?{
    partner:PARTNERS[state.partnerId].name,
    tools:state.tools, followers:state.followers,
    money:state.money, yaruki:state.yaruki, month:state.month
  }:null;
  const reached=loadEndings();
  reached.add(endingId);
  saveEndings(reached);
  localStorage.removeItem(SAVE_KEY);
  state=null;
  pendingMonthSplash=null; pendingCutin=null;
  const app=$('#app');
  app.innerHTML=`
    <div class="panel ending-screen scene-enter">
      <div class="ending-badge">ENDING</div>
      <div class="ending-name">${ending.name}</div>
      <div class="ending-text">${ending.text}</div>
      ${currentNote?`<div class="msg-note" style="max-width:600px;margin:14px auto 0;text-align:left">${currentNote}</div>`:''}
      ${finalStats?`
      <div class="ending-stats">
        <div class="ending-stat"><div class="k">相棒</div><div class="v">${finalStats.partner}</div></div>
        <div class="ending-stat"><div class="k">到達月</div><div class="v">${finalStats.month}ヶ月目</div></div>
        <div class="ending-stat"><div class="k">公開数</div><div class="v">${finalStats.tools}</div></div>
        <div class="ending-stat"><div class="k">フォロワー</div><div class="v">${finalStats.followers}</div></div>
        <div class="ending-stat"><div class="k">お金</div><div class="v">${finalStats.money.toLocaleString()}円</div></div>
        <div class="ending-stat"><div class="k">やる気</div><div class="v">${finalStats.yaruki}</div></div>
      </div>`:''}
      <div class="title-btns">
        <button class="btn-game primary" id="againBtn">もう1年やる</button>
        <button class="btn-game" id="endTitleBtn">タイトルに戻る</button>
      </div>
    </div>
    ${galleryHTML()}
  `;
  $('#againBtn').addEventListener('click',renderPartnerSelect);
  $('#endTitleBtn').addEventListener('click',renderTitle);
}

/* ===== 初期化 ===== */
document.addEventListener('DOMContentLoaded',renderTitle);
</script>
</body>
</html>
